name: Stimmen Sokrates

# Erzeugt die KI-Stimmen (Google Chirp 3: HD) für die Dialog-Bühne unter /unterricht/sokrates/.
# Start: GitHub → Actions → "Stimmen Sokrates" → Run workflow → Modus wählen.
# Braucht das Repo-Geheimnis GOOGLE_TTS_KEY (API-Schlüssel, nur für die Text-to-Speech API freigegeben).
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "proben = 3 Stimmproben je Figur · alle = alle Repliken erzeugen"
        type: choice
        options: [proben, alle]
        default: proben

permissions:
  contents: write

concurrency:
  group: stimmen-sokrates
  cancel-in-progress: false

jobs:
  stimmen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stimmen erzeugen (${{ inputs.modus }})
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: node scripts/tts-sokrates.mjs "${{ inputs.modus }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A unterricht/sokrates
          if git diff --cached --quiet; then echo "Nichts Neues." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -m "Stimmen Sokrates: ${{ inputs.modus }} (Google Chirp 3: HD)"
          git push
